
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>My Assistant</h2>
        <button id="closeSidebar" type="button">×</button>
      </div>

      <button id="newChat" class="new-chat" type="button">
        + New Chat
      </button>

      <div id="chatList" class="chat-list"></div>
    </aside>

    <section class="workspace">
      <header class="header">
        <button id="menuToggle" type="button">☰</button>
        <div>
          <h1>Personal AI Assistant</h1>
          <p>Online</p>
        </div>
      </header>

      <main id="chat" class="chat">
        <div class="welcome">
          <h2>Hello! 👋</h2>
          <p>How can I help you today?</p>
        </div>
      </main>

      <form id="chatForm" class="chat-form">
        <div id="fileStatus" class="file-status"></div>

        <div class="input-area">
          <input
            type="file"
            id="fileInput"
            accept=".pdf,.txt,application/pdf,text/plain"
            hidden
          >

          <button id="attachFile" type="button" title="Attach PDF or TXT">
            📎
          </button>

          <textarea
            id="message"
            placeholder="Ask me anything..."
            rows="1"
            required
          ></textarea>

          <button id="voiceInput" type="button" title="Voice input">
            🎤
          </button>

          <button id="send" type="submit">Send</button>
        </div>

        <p id="voiceStatus"></p>
      </form>

      <footer>
        Your Personal AI Assistant
      </footer>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
