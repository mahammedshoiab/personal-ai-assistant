
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>✦ My AI</h2>
        <button id="closeSidebar" type="button">✕</button>
      </div>

      <button id="newChat" class="new-chat" type="button">
        ＋ New Chat
      </button>

      <h3 class="history-heading">Recent Chats</h3>

      <div id="chatList" class="chat-list"></div>

      <div class="sidebar-footer">
        Personal AI Assistant
      </div>
    </aside>

    <section class="workspace">

      <header>
        <button id="menuToggle" type="button"
          aria-label="Open chat history">☰</button>

        <div class="logo">✦</div>

        <div>
          <h2>My Personal AI</h2>
          <span>● Online</span>
        </div>
      </header>

      <main id="chat">
        <div class="welcome">
          <div class="welcome-icon">✦</div>
          <h1>How can I help you?</h1>
          <p>Your personal AI assistant is ready.</p>
        </div>
      </main>

      <form id="chatForm">
        <textarea
          id="message"
          placeholder="Ask me anything..."
          rows="1"
        ></textarea>

        <button
          type="button"
          id="voiceInput"
          title="Speak your message"
          aria-label="Start voice input"
        >🎤</button>

        <button type="submit" id="send">➤</button>
      </form>

      <div id="voiceStatus" class="voice-status"
        aria-live="polite"></div>

      <footer>
        AI can make mistakes. Check important information.
      </footer>

    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
